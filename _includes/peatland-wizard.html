<style>
.wizard {
  font-family: var(--ff-sans, 'Source Sans 3', sans-serif);
  margin: var(--sp-lg, 2rem) 0;
}

.wizard__progress {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 1.5rem;
}

.wizard__progress-bar {
  flex: 1;
  height: 4px;
  background: var(--fen, #CCE3DE);
  border-radius: 2px;
  overflow: hidden;
}

.wizard__progress-fill {
  height: 100%;
  background: var(--sedge, #6B9080);
  border-radius: 2px;
  transition: width 0.4s ease;
}

.wizard__progress-label {
  font-size: 0.75rem;
  color: var(--muted, #4a6b5e);
  white-space: nowrap;
}

.wizard__card {
  background: var(--bloom, #F6FFF8);
  border: 1px solid var(--fen, #CCE3DE);
  border-radius: 8px;
  padding: 1.5rem;
  min-height: 160px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 1.25rem;
}

.wizard__question {
  font-size: clamp(0.95rem, 2vw, 1.1rem);
  font-weight: 500;
  color: var(--deep-forest, #1a2e28);
  line-height: 1.5;
  margin: 0;
}

.wizard__hint {
  font-size: 0.8rem;
  color: var(--muted, #4a6b5e);
  margin-top: 0.25rem;
  font-style: italic;
}

.wizard__actions {
  display: flex;
  gap: 0.75rem;
  flex-wrap: wrap;
}

.wizard__btn {
  flex: 1;
  min-width: 100px;
  padding: 10px 20px;
  border-radius: 4px;
  border: none;
  font-family: var(--ff-sans, 'Source Sans 3', sans-serif);
  font-size: 0.875rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  letter-spacing: 0.03em;
}

.wizard__btn:active { transform: scale(0.98); }

.wizard__btn--yes {
  background: var(--sedge, #6B9080);
  color: var(--bloom, #F6FFF8);
}
.wizard__btn--yes:hover { background: var(--deep-sedge, #3d6355); }

.wizard__btn--no {
  background: #8B2635;
  color: #F6FFF8;
}
.wizard__btn--no:hover { background: #6B1428; }

.wizard__btn--reset {
  flex: 0;
  background: transparent;
  color: var(--muted, #4a6b5e);
  border: 1px solid var(--fen, #CCE3DE);
  padding: 8px 16px;
  font-size: 0.8rem;
}
.wizard__btn--reset:hover {
  background: var(--mist, #EAF4F4);
  color: var(--deep-forest, #1a2e28);
}

.wizard__breadcrumb {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 0.75rem;
  min-height: 24px;
}

.wizard__crumb {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--mist, #EAF4F4);
  color: var(--muted, #4a6b5e);
}

.wizard__crumb--yes { background: #d4e8e1; color: #2d5a4a; }
.wizard__crumb--no  { background: #f0d0d4; color: #6B1428; }

/* Result card */
.wizard__result {
  background: var(--mist, #EAF4F4);
  border: 1.5px solid var(--sedge, #6B9080);
  border-radius: 8px;
  padding: 1.5rem;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

.wizard__result-label {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--sedge, #6B9080);
  margin-bottom: 0.5rem;
}

.wizard__result-title {
  font-size: clamp(1.1rem, 2.5vw, 1.4rem);
  font-weight: 600;
  color: var(--deep-forest, #1a2e28);
  margin-bottom: 0.75rem;
  line-height: 1.3;
}

.wizard__result-desc {
  font-size: 0.9rem;
  color: var(--bog-ink, #233d35);
  line-height: 1.7;
  margin-bottom: 1rem;
}

.wizard__result-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 1.25rem;
}

.wizard__tag {
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 10px;
  border-radius: 3px;
  background: var(--fen, #CCE3DE);
  color: var(--deep-sedge, #3d6355);
}

@media (max-width: 480px) {
  .wizard__btn { min-width: 80px; }
  .wizard__card { padding: 1.25rem; }
}
</style>

<div class="wizard" id="peatland-wizard">

  <div class="wizard__progress">
    <div class="wizard__progress-bar">
      <div class="wizard__progress-fill" id="wiz-progress" style="width:0%"></div>
    </div>
    <span class="wizard__progress-label" id="wiz-step-label">Step 1</span>
  </div>

  <div class="wizard__breadcrumb" id="wiz-breadcrumb"></div>

  <div id="wiz-content"></div>

</div>

<script>
(function() {

  // ── Decision tree ──────────────────────────────────────────────────────────
  // Each node: { q, hint?, yes, no }
  // Leaf nodes: { result, desc, tags }

  var tree = {
    start: {
      q: "Is substantial peat present at the site?",
      hint: "Peat is a dark, spongy organic soil formed from partially decomposed plant material, typically >30 cm deep.",
      yes: "rain_fed",
      no: {
        result: "Not a peatland",
        desc: "Without substantial peat accumulation, this site is unlikely to be a true fen or bog system. It may be a wet grassland, marsh, or mineral-soil wetland.",
        tags: ["Non-peatland", "Wetland"]
      }
    },
    rain_fed: {
      q: "Is the system mainly rain-fed (ombrotrophic)?",
      hint: "Rain-fed systems receive water and nutrients almost entirely from precipitation, isolated from groundwater and surface runoff.",
      yes: "acidic",
      no: "groundwater"
    },

    // ── BOG BRANCH ────────────────────────────────────────────────────────────
    acidic: {
      q: "Is the pH extremely acidic (3–4.5)?",
      hint: "Use a pH meter or indicator strips on surface water or pore water.",
      yes: "dome",
      no: {
        result: "Poor fen or transitional mire",
        desc: "The system is rain-fed but not extremely acidic, suggesting a transitional zone between bog and fen conditions. Sphagnum mosses may be present alongside minerotrophic species.",
        tags: ["Transitional", "Poor fen", "Mire"]
      }
    },
    dome: {
      q: "Is the peat dome elevated above the surrounding landscape?",
      hint: "A raised bog forms a characteristic convex dome that can rise several metres above the surrounding terrain.",
      yes: {
        result: "Raised Bog",
        desc: "A raised bog is an ombrotrophic peatland with a characteristic dome-shaped profile, elevated above its surroundings. It is fed entirely by precipitation and is extremely acidic and nutrient-poor. Sphagnum mosses are the dominant peat-formers.",
        tags: ["Bog", "Ombrotrophic", "Sphagnum", "Raised bog"]
      },
      no: "blanket"
    },
    blanket: {
      q: "Does peat blanket slopes or upland plateaus continuously?",
      hint: "Blanket bogs develop under high rainfall conditions, draping across the landscape rather than forming a distinct dome.",
      yes: {
        result: "Blanket Bog",
        desc: "Blanket bogs form under hyperoceanic climate conditions with very high rainfall, covering upland slopes and plateaus with a continuous layer of peat. Common in the British Isles, Scandinavia, and Patagonia.",
        tags: ["Bog", "Ombrotrophic", "Blanket bog", "Upland"]
      },
      no: "quaking"
    },
    quaking: {
      q: "Is there a floating or quaking peat mat?",
      hint: "A quaking bog has a floating mat of peat and vegetation over open water — walking on it causes a trembling sensation.",
      yes: {
        result: "Transitional or Quaking Bog",
        desc: "A quaking or schwingmoor bog features a floating mat of Sphagnum and sedges over open water. These systems represent an intermediate stage in terrestrialisation and are often found at the margins of lakes or pools.",
        tags: ["Bog", "Quaking", "Transitional", "Schwingmoor"]
      },
      no: {
        result: "Degraded bog complex",
        desc: "The system has bog characteristics but does not clearly fit raised, blanket, or quaking bog types. This may indicate past disturbance, drainage, or a degraded condition that has altered the original structure.",
        tags: ["Bog", "Degraded", "Complex"]
      }
    },

    // ── FEN BRANCH ────────────────────────────────────────────────────────────
    groundwater: {
      q: "Is groundwater influence clearly present?",
      hint: "Look for lateral water seepage, spring activity, or groundwater-fed inflows. Water conductivity is typically higher than in rain-fed systems.",
      yes: "alkaline",
      no: {
        result: "Possible bog transition zone",
        desc: "The system does not clearly receive groundwater but is not purely rain-fed either. This may represent a bog-fen transition, a perched bog, or a hydrologically isolated system.",
        tags: ["Transitional", "Uncertain hydrology"]
      }
    },
    alkaline: {
      q: "Is the water calcium-rich or alkaline (pH > 6)?",
      hint: "Rich fens have higher pH and conductivity due to base-rich groundwater inputs. Use a conductivity meter or observe calcite precipitates.",
      yes: "brown_mosses",
      no: "moderately_acidic"
    },

    // Rich fen branch
    brown_mosses: {
      q: "Are brown mosses (Calliergon, Scorpidium, Drepanocladus) abundant?",
      hint: "Brown mosses are a key indicator of rich fen conditions. They form dense carpets in base-rich, waterlogged environments.",
      yes: "seepage",
      no: "schoenus"
    },
    seepage: {
      q: "Is constant groundwater seepage or spring activity present?",
      hint: "Look for persistent water tracks, tufa deposits, or consistent lateral flow from hillslopes.",
      yes: {
        result: "Base-rich Spring Fen",
        desc: "A spring fen (also called a flush or soligenous mire) is fed by constant groundwater seepage or spring water. These are among the most species-rich habitats in Europe, supporting rare specialist plants and invertebrates. Often found on hillslopes or valley sides.",
        tags: ["Fen", "Rich fen", "Spring fen", "Soligenous", "High biodiversity"]
      },
      no: {
        result: "Rich Fen or Alkaline Fen",
        desc: "A rich fen is a minerotrophic peatland fed by base-rich groundwater. It supports a diverse community of brown mosses, sedges, and specialist vascular plants. Distinguished from poor fens by higher pH, conductivity, and floristic richness.",
        tags: ["Fen", "Rich fen", "Minerotrophic", "Base-rich"]
      }
    },
    schoenus: {
      q: "Is Schoenus nigricans or Cladium mariscus present?",
      hint: "Black bog-rush (Schoenus nigricans) and great fen-sedge (Cladium mariscus) are strong indicators of alkaline fen conditions.",
      yes: {
        result: "Alkaline Fen",
        desc: "Alkaline fens are characterised by base-rich, calcareous groundwater and specialist vegetation including Schoenus nigricans or Cladium mariscus. They are rare and highly threatened habitats in Europe, listed under Annex I of the Habitats Directive.",
        tags: ["Fen", "Alkaline fen", "Calcareous", "Annex I habitat"]
      },
      no: {
        result: "Degraded rich fen",
        desc: "The site has rich fen chemistry but lacks the characteristic brown moss or specialist vascular plant communities. This suggests past disturbance, eutrophication, or hydrological alteration has reduced biodiversity.",
        tags: ["Fen", "Rich fen", "Degraded"]
      }
    },

    // Poor fen branch
    moderately_acidic: {
      q: "Is the pH moderately acidic (4.5–6)?",
      hint: "Poor fens occupy the chemistry range between bogs and rich fens — acidic but still receiving some mineral input from groundwater.",
      yes: "sphagnum_sedge",
      no: {
        result: "Reassess water chemistry",
        desc: "The water chemistry does not clearly fall into rich or poor fen ranges. Consider retesting under different hydrological conditions, or this may be a disturbed or transitional system.",
        tags: ["Uncertain", "Transitional"]
      }
    },
    sphagnum_sedge: {
      q: "Are Sphagnum mosses and sedges (Carex spp.) both abundant?",
      hint: "Poor fens typically support both Sphagnum species and a range of sedges, reflecting the intermediate chemistry conditions.",
      yes: {
        result: "Poor Fen",
        desc: "A poor fen is a weakly minerotrophic peatland intermediate between bog and rich fen conditions. It receives limited groundwater input, resulting in moderately acidic, nutrient-poor conditions. Sphagnum and sedges co-dominate.",
        tags: ["Fen", "Poor fen", "Weakly minerotrophic", "Sphagnum"]
      },
      no: "valley_fen"
    },
    valley_fen: {
      q: "Is the system in a valley, fed by groundwater but still acidic?",
      hint: "Valley fens occur in topographic depressions where groundwater collects but may still be relatively acidic due to the surrounding geology.",
      yes: {
        result: "Acidic Valley Fen",
        desc: "An acidic valley fen occurs in lowland or upland valleys where groundwater collects but the geology provides limited base enrichment. These systems support a mix of Sphagnum, sedges, and acid-tolerant rushes.",
        tags: ["Fen", "Valley fen", "Acidic", "Topogenous"]
      },
      no: {
        result: "Degraded poor fen complex",
        desc: "The site has poor fen chemistry but the vegetation community is unclear or degraded. Past drainage, peat extraction, or agricultural modification may have altered the original character.",
        tags: ["Fen", "Poor fen", "Degraded"]
      }
    }
  };

  // ── State ──────────────────────────────────────────────────────────────────
  var current = "start";
  var history = [];
  var totalSteps = 12; // approximate max depth

  // ── Render ─────────────────────────────────────────────────────────────────
  function render() {
    var node = tree[current];
    var content = document.getElementById("wiz-content");
    var breadcrumb = document.getElementById("wiz-breadcrumb");
    var progress = document.getElementById("wiz-progress");
    var stepLabel = document.getElementById("wiz-step-label");

    // Progress
    var pct = Math.min(100, Math.round((history.length / totalSteps) * 100));
    progress.style.width = pct + "%";
    stepLabel.textContent = "Step " + (history.length + 1);

    // Breadcrumb
    breadcrumb.innerHTML = history.map(function(h) {
      return '<span class="wizard__crumb wizard__crumb--' + h.answer + '">' + h.short + ' → ' + h.answer + '</span>';
    }).join("");

    // Result
    if (node.result) {
      content.innerHTML = renderResult(node);
      return;
    }

    // Question
    content.innerHTML = '<div class="wizard__card">' +
      '<div>' +
        '<p class="wizard__question">' + node.q + '</p>' +
        (node.hint ? '<p class="wizard__hint">' + node.hint + '</p>' : '') +
      '</div>' +
      '<div class="wizard__actions">' +
        '<button class="wizard__btn wizard__btn--yes" onclick="wizAnswer(true)">Yes</button>' +
        '<button class="wizard__btn wizard__btn--no" onclick="wizAnswer(false)">No</button>' +
        (history.length > 0 ? '<button class="wizard__btn wizard__btn--reset" onclick="wizBack()">← Back</button>' : '') +
      '</div>' +
    '</div>';
  }

  function renderResult(node) {
    return '<div class="wizard__result">' +
      '<div class="wizard__result-label">Identified peatland type</div>' +
      '<div class="wizard__result-title">' + node.result + '</div>' +
      '<div class="wizard__result-desc">' + node.desc + '</div>' +
      '<div class="wizard__result-tags">' +
        node.tags.map(function(t) { return '<span class="wizard__tag">' + t + '</span>'; }).join("") +
      '</div>' +
      '<button class="wizard__btn wizard__btn--reset" onclick="wizReset()" style="margin-top:0.25rem">Start over</button>' +
    '</div>';
  }

  // ── Actions ────────────────────────────────────────────────────────────────
  window.wizAnswer = function(yes) {
    var node = tree[current];
    var next = yes ? node.yes : node.no;
    var short = node.q.length > 40 ? node.q.substring(0, 40) + "…" : node.q;

    history.push({ from: current, answer: yes ? "yes" : "no", short: short });

    if (typeof next === "string") {
      current = next;
    } else {
      // inline result node
      current = "__result__";
      tree["__result__"] = next;
    }
    render();
  };

  window.wizBack = function() {
    if (history.length === 0) return;
    var prev = history.pop();
    current = prev.from;
    render();
  };

  window.wizReset = function() {
    current = "start";
    history = [];
    render();
  };

  // ── Init ───────────────────────────────────────────────────────────────────
  render();

})();
</script>

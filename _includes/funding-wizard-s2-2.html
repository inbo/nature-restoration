<div class="fw" id="fw-s22">
  <div class="fw__crumbs" id="fw-s22-crumbs"></div>
  <div id="fw-s22-content"></div>
</div>

<script>
(function(){
var R1='<b>Public EU funds:</b><ul><li>CAP eco-schemes, AECMs, INVEST interventions <i>[core funding]</i></li><li>Cohesion policy funds (ERDF, CF, JTF) <i>[core funding]</i></li><li>LIFE Programme <i>[supplementary funding]</i></li><li>Recovery and Resilience Facility <i>[supplementary funding]</i></li></ul><b>Public National funds:</b> check National Restoration Plans<br><br><b>Private supplementary funds:</b><ul><li><i>potentially</i> Carbon Removal Carbon Farming Certification</li><li>InvestEU Programme</li></ul>';
var R2='<b>Public funds:</b><ul><li>Cohesion policy funds (ERDF, CF, JTF) <i>[core funding]</i></li><li>LIFE Programme <i>[supplementary funding]</i></li><li>Recovery and Resilience Facility <i>[supplementary funding]</i></li></ul><b>Public National funds:</b> check National Restoration Plans<br><br><b>Private supplementary funds:</b><ul><li>InvestEU Programme</li></ul>';

var TREE={
  Q1:{q:'Are you legally required, under national, regional or local law, to restore your peatland as part of your Member State\'s implementation of Article 11 of the Nature Restoration Regulation?',yes:'Q2',no:'Q3'},
  Q2:{q:'Does your planned restoration exceed the minimum legal requirements?',yes:{r:R1},no:{r:R2}},
  Q3:{q:'Is peatland restoration or rewetting identified or recommended in the National Restoration Plan of your Member State?',yes:{r:R1},no:'__sec4__'}
};

var hist=[],cur='Q1';
var content=document.getElementById('fw-s22-content');
var crumbs=document.getElementById('fw-s22-crumbs');
function shortQ(q){return q.length>50?q.substring(0,50)+'…':q;}
function render(){
  crumbs.innerHTML=hist.map(function(h){return'<span class="fw__crumb fw__crumb--'+h.a+'">'+h.s+' → '+h.a+'</span>';}).join('');
  if(cur==='__sec4__'){
    content.innerHTML='<div class="fw__result"><div class="fw__result-label">Next step</div><div class="fw__result-body">Your site does not meet the criteria for NRR Article 11 funding pathways.<br><br><a class="fw__goto" href="#325-section-4-other-scenarios">Go to Section 4 — Other scenarios →</a></div></div><div style="margin-top:.75rem"><button class="fw__btn fw__btn--ghost" onclick="fwS22Back()">← Back</button></div>';
    return;
  }
  var node=TREE[cur];
  if(node.r!==undefined){
    content.innerHTML='<div class="fw__result"><div class="fw__result-label">Relevant funding instruments</div><div class="fw__result-body">'+node.r+'</div></div><div style="margin-top:.75rem"><button class="fw__btn fw__btn--ghost" onclick="fwS22Back()">← Back</button>&nbsp;<button class="fw__btn fw__btn--ghost" onclick="fwS22Reset()">Start over</button></div>';
    return;
  }
  content.innerHTML='<div class="fw__card"><p class="fw__q">'+node.q+'</p><div class="fw__actions"><button class="fw__btn fw__btn--yes" onclick="fwS22Ans(true)">Yes</button><button class="fw__btn fw__btn--no" onclick="fwS22Ans(false)">No</button>'+(hist.length>0?'<button class="fw__btn fw__btn--ghost" onclick="fwS22Back()">← Back</button>':'')+'</div></div>';
}
window.fwS22Ans=function(yes){var node=TREE[cur];hist.push({from:cur,a:yes?'yes':'no',s:shortQ(node.q)});var next=yes?node.yes:node.no;if(typeof next==='string'){cur=next;}else{var k='__r__'+Date.now();TREE[k]=next;cur=k;}render();};
window.fwS22Back=function(){if(!hist.length)return;cur=hist.pop().from;render();};
window.fwS22Reset=function(){hist=[];cur='Q1';render();};
render();
})();
</script>

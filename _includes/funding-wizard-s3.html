<div class="fw" id="fw-s3">
  <div class="fw__crumbs" id="fw-s3-crumbs"></div>
  <div id="fw-s3-content"></div>
</div>

<script>
(function(){
var R1='<b>Public EU funds:</b><ul><li>CAP eco-schemes, AECMs, INVEST interventions <i>[core funding]</i></li><li>Cohesion policy funds (ERDF, CF) <i>[core funding]</i></li><li>Recovery and Resilience Facility <i>[core funding]</i></li><li>LIFE Programme <i>[supplementary funding]</i></li></ul><b>Public National funds:</b> check National River Basin Management Plans<br><br><b>Private supplementary funds:</b><ul><li><i>potentially</i> Carbon Removal Carbon Farming Certification</li><li>InvestEU Programme</li></ul>';
var R2='<b>Public EU funds:</b><ul><li>Cohesion policy funds (ERDF, CF) <i>[core funding]</i></li><li>Recovery and Resilience Facility <i>[core funding]</i></li><li>LIFE Programme <i>[supplementary funding]</i></li></ul><b>Public National funds:</b> check National River Basin Management Plans<br><br><b>Private supplementary funds:</b><ul><li><i>potentially</i> Carbon Removal Carbon Farming Certification</li><li>InvestEU Programme</li></ul>';
var R3='<b>Public EU funds:</b><ul><li>CAP eco-schemes, AECMs, INVEST interventions <i>[core funding]</i></li><li>Cohesion policy funds (ERDF, CF) <i>[core funding]</i></li><li>Recovery and Resilience Facility <i>[core funding]</i></li><li>LIFE Programme <i>[supplementary funding]</i></li></ul><b>Public National funds:</b> check National River Basin Management Plans<br><br><b>Private supplementary funds:</b><ul><li>InvestEU Programme</li></ul>';
var R4='<b>Public EU funds:</b><ul><li>Cohesion policy funds (ERDF, CF) <i>[core funding]</i></li><li>Recovery and Resilience Facility <i>[core funding]</i></li><li>LIFE Programme <i>[supplementary funding]</i></li></ul><b>Public National funds:</b> check National River Basin Management Plans<br><br><b>Private supplementary funds:</b><ul><li>InvestEU Programme</li></ul>';

var TREE={
  Q1:{q:'Are you legally required to restore or rewet your peatland under national, regional or local law (including measures implementing the Programme of Measures of the River Basin Management Plan)?',yes:'Q2',no:'Q4'},
  Q2:{q:'Does your planned restoration exceed the minimum legal requirements?',yes:'Q3a',no:'Q5a'},
  Q3a:{q:'Is your peatland site under agricultural use and eligible to CAP payments?',yes:{r:R1},no:{r:R2}},
  Q4:{q:'Is peatland restoration or rewetting identified as a recommended measure or priority action in your River Basin Management Plan\'s Programme of Measures?',yes:'Q3a',no:'__sec4__'},
  Q5a:{q:'Is your peatland site under agricultural use and eligible to CAP payments?',yes:{r:R3},no:{r:R4}}
};

var hist=[],cur='Q1';
var content=document.getElementById('fw-s3-content');
var crumbs=document.getElementById('fw-s3-crumbs');
function shortQ(q){return q.length>50?q.substring(0,50)+'…':q;}
function render(){
  crumbs.innerHTML=hist.map(function(h){return'<span class="fw__crumb fw__crumb--'+h.a+'">'+h.s+' → '+h.a+'</span>';}).join('');
  if(cur==='__sec4__'){
    content.innerHTML='<div class="fw__result"><div class="fw__result-label">Next step</div><div class="fw__result-body">Your site does not meet the criteria for WFD funding pathways under this section.<br><br><a class="fw__goto" href="#325-section-4-other-scenarios">Go to Section 4 — Other scenarios →</a></div></div><div style="margin-top:.75rem"><button class="fw__btn fw__btn--ghost" onclick="fwS3Back()">← Back</button></div>';
    return;
  }
  var node=TREE[cur];
  if(node.r!==undefined){
    content.innerHTML='<div class="fw__result"><div class="fw__result-label">Relevant funding instruments</div><div class="fw__result-body">'+node.r+'</div></div><div style="margin-top:.75rem"><button class="fw__btn fw__btn--ghost" onclick="fwS3Back()">← Back</button>&nbsp;<button class="fw__btn fw__btn--ghost" onclick="fwS3Reset()">Start over</button></div>';
    return;
  }
  content.innerHTML='<div class="fw__card"><p class="fw__q">'+node.q+'</p><div class="fw__actions"><button class="fw__btn fw__btn--yes" onclick="fwS3Ans(true)">Yes</button><button class="fw__btn fw__btn--no" onclick="fwS3Ans(false)">No</button>'+(hist.length>0?'<button class="fw__btn fw__btn--ghost" onclick="fwS3Back()">← Back</button>':'')+'</div></div>';
}
window.fwS3Ans=function(yes){var node=TREE[cur];hist.push({from:cur,a:yes?'yes':'no',s:shortQ(node.q)});var next=yes?node.yes:node.no;if(typeof next==='string'){cur=next;}else{var k='__r__'+Date.now();TREE[k]=next;cur=k;}render();};
window.fwS3Back=function(){if(!hist.length)return;cur=hist.pop().from;render();};
window.fwS3Reset=function(){hist=[];cur='Q1';render();};
render();
})();
</script>
